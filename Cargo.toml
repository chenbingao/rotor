[package]
name = "rotor-wheel"
version = "0.5.0"
edition = "2024"
description = "General-purpose hierarchical timing wheel — heartbeat, one-shot delays, request timeouts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chenbingao/rotor-wheel"
readme = "README.md"
keywords = ["timing-wheel", "heartbeat", "netty", "scheduler", "timer"]
categories = ["asynchronous", "data-structures"]


[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "throughput"
harness = false
