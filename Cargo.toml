[package]
name = "rotor"
version = "0.1.0"
edition = "2024"
description = "General-purpose hierarchical timing wheel — heartbeat, one-shot delays, request timeouts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chenbingao/rotor"
readme = "README.md"
keywords = ["rotor", "heartbeat", "timer", "netty", "scheduler", "delay", "timeout"]
categories = ["asynchronous", "data-structures"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "throughput"
harness = false
